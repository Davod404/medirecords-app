server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: hospital
          uri: lb://hospitales
          predicates:
            - Path=/api/hospitales/**
        - id: paciente
          uri: lb://paciente
          predicates:
            - Path=/api/pacientes/**
        - id: medicamento
          uri: lb://medicamentos
          predicates:
            - Path=/api/medicamentos/**
        - id: cargo
          uri: lb://cargo
          predicates:
            - Path=/api/cargos/**
        - id: especialidad
          uri: lb://especialidad
          predicates:
            - Path=/api/especialidades/**
        - id: personal
          uri: lb://personal
          predicates:
            - Path=/api/personal/**
        - id: receta
          uri: lb://receta
          predicates:
            - Path=/api/recetas/**
        - id: consulta
          uri: lb://consulta
          predicates:
            - Path=/api/consultas/**
        - id: historial
          uri: lb://historial
          predicates:
            - Path=/api/historiales/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ 